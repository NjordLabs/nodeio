repo: NjordLabs/nodeio

milestones:
  - name: Phase 1 — Foundation
    epics:
      - id: ENG-001
        status: open
        title: Replace the graph engine
        overview:
          problem: >-
            Loading a cyclic graph never returned, async work ran on the
            event loop, and concurrent runs shared one context.
          goal: >-
            An immutable definition, a ready queue, and one isolated run
            per request.
        decision: >-
          In the context of a Python service graph, facing shared mutable
          runs, we decided to compile a definition once and execute a
          fresh run per request, to achieve isolated requests, accepting
          that the previous NetworkX loader is removed.
        acceptance_criteria:
          - A cycle fails at load time and names the nodes
          - Two runs of one definition do not share values
          - Async runners are awaited and synchronous runners leave the loop
        guardrail_refs:
          - PY-TEST-002
          - PY-CONC-001
        tasks:
          - id: ENG-001-T1
            status: done
            title: Implement the definition, scheduler, and executors
            instructions:
              files:
                - src/nodeio/graph.py
                - src/nodeio/run.py
                - src/nodeio/executors.py
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - PY-TEST-002
          - id: ENG-001-T2
            status: open
            title: Publish to PyPI with a trusted publisher
            instructions:
              files:
                - .github/workflows/publish-pypi.yml
            verification:
              - Pending publisher for NjordLabs/nodeio, workflow .github/workflows/publish-pypi.yml, environment pypi
            guardrail_refs:
              - PY-TEST-002
      - id: BIND-001
        status: rejected
        title: Bind the C++ libraries into this package
        resolution: >-
          The C++ graph is single-threaded and copies values along edges,
          and the pattern library is trivial in Python, so bindings would
          not remove a cost. The vision library is the only candidate with
          a real gain, and it stays out of reach while that library is
          private. Revisit with a stable ABI wheel when a Python node needs
          those algorithms.
        overview:
          problem: >-
            Callers asked whether the C++ libraries should be imported
            through a binding.
          goal: >-
            Record why this wave does not add bindings.
        decision: >-
          In the context of a Python graph engine, facing a request for
          bindings, we decided not to add them in this wave, to achieve a
          pure-Python release, accepting that vision algorithms stay in
          the C++ library until a node needs them.
        guardrail_refs:
          - PY-CONC-001
      - id: WORK-001
        status: open
        title: Split queue workers into a later package
        overview:
          problem: >-
            A multi-host queue needs brokers, retries, and dead letters,
            which would bury the graph engine.
          goal: >-
            Keep an executor protocol here and add a worker package only
            when a deployment must scale across hosts.
        decision: >-
          In the context of image work on one host, facing a request for
          a queue, we decided to ship a process executor and shared
          memory now and leave the worker package for later, to achieve
          a small engine, accepting that cross-host jobs are not served
          yet.
        guardrail_refs:
          - PY-CONC-001
      - id: STREAM-001
        status: open
        title: Decide timestamped stream sync
        overview:
          problem: >-
            Video frames need timestamps and input sync, and this wave's
            runs are request-shaped.
          goal: >-
            Record the decision point without implementing stream sync.
        decision: >-
          In the context of a request-shaped graph, facing video sync,
          we decided to leave timestamped streaming for a later epic,
          to achieve a shippable request engine, accepting that frame
          sync is not available yet.
        guardrail_refs:
          - PY-CONC-001
      - id: LIFE-001
        status: done
        title: Give nodes an open, process, and close lifecycle
        overview:
          problem: >-
            A node is a runner callable. It cannot open a resource
            before the first request or close it after the last.
          goal: >-
            A node can open, process, and close without changing the
            request-shaped scheduler.
        decision: >-
          In the context of a request-shaped graph, facing nodes that
          hold resources, we decided to call open once before the first
          process and close in a finally, to achieve cleanup when process
          fails, accepting that a plain callable stays a runner.
        guardrail_refs:
          - PY-CONC-001
        tasks:
          - id: LIFE-001-T1
            status: done
            title: Call open and close around a node's process method
            instructions:
              files:
                - src/nodeio/graph.py
                - src/nodeio/run.py
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - PY-TEST-002
      - id: FLOW-001
        status: done
        title: Bound queues between nodes
        overview:
          problem: >-
            The scheduler limits how many nodes run at once. It does
            not bound the values waiting on an edge.
          goal: >-
            A producer blocks when a downstream queue is full.
        decision: >-
          In the context of a request-shaped graph, facing unbounded
          edges, we decided to wait the producer when a per-edge or
          graph-level bound is full, to achieve backpressure, accepting
          that the default bound stays unlimited.
        guardrail_refs:
          - PY-CONC-001
        tasks:
          - id: FLOW-001-T1
            status: done
            title: Add a bounded queue and backpressure on edges
            instructions:
              files:
                - src/nodeio/run.py
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - PY-TEST-002
      - id: GRPC-001
        status: done
        title: Call gRPC through a real channel
        overview:
          problem: >-
            The gRPC node requires an injected call. The default path
            reports that the grpc extra is not installed.
          goal: >-
            An installed extra opens a TLS channel with the required
            deadline.
        decision: >-
          In the context of a client node, facing a missing channel,
          we decided to open a grpc.aio channel from target when the
          extra is installed, to achieve a deadline and optional mutual
          TLS, accepting that an insecure channel requires
          allow_insecure.
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: GRPC-001-T1
            status: done
            title: Open a TLS grpcio.aio channel from the grpc extra
            instructions:
              files:
                - src/nodeio/pipes.py
                - pyproject.toml
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - PY-TEST-002
      - id: OTEL-001
        status: done
        title: Export node spans from an optional extra
        overview:
          problem: >-
            Logging events have a run id and a duration. They are not
            OpenTelemetry spans.
          goal: >-
            An extra can emit a span per node without a required
            dependency.
        decision: >-
          In the context of a graph run, facing a request for traces,
          we decided to start a span per node when the optional extra
          is installed and to no-op otherwise, to achieve traces
          without a required dependency, accepting that the SDK is
          not bundled.
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: OTEL-001-T1
            status: done
            title: Add an OpenTelemetry observer extra
            instructions:
              files:
                - src/nodeio/observe.py
                - pyproject.toml
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - PY-TEST-002
      - id: HOST-001
        status: done
        title: Cover Python 3.14 and the container CI script
        overview:
          problem: >-
            The test matrix is Python 3.13, and the container parity
            script lives in the scaffold submodule rather than scripts/.
          goal: >-
            The test job can run on 3.14, and a repo-level script can
            run the remaining tools in Docker.
        decision: >-
          In the context of the first release, facing a single
          interpreter, we decided to test Python 3.13 and 3.14 and to
          add a repo-level container script, to achieve a wider matrix,
          accepting that the container image stays private and the host
          script remains the default gate.
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: HOST-001-T1
            status: done
            title: Run the test job on Python 3.14
            instructions:
              files:
                - .github/workflows/ci-quality.yml
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - PY-TEST-002
          - id: HOST-001-T2
            status: done
            title: Add a repo-level container CI script
            instructions:
              files:
                - scripts/check-ci-docker.sh
            verification:
              - sh scripts/check-ci-docker.sh
            guardrail_refs:
              - PY-TEST-002
      - id: CANCEL-001
        status: done
        title: Cancel in-flight nodes when the run is cancelled
        overview:
          problem: >-
            A cancelled caller left node tasks running, and a node with
            a close method could skip it.
          goal: >-
            In-flight node tasks stop, and close still runs.
        decision: >-
          In the context of a graph run, facing a cancelled caller, we
          decided to cancel in-flight node tasks and still run close, to
          achieve prompt shutdown, accepting that thread and process
          workers keep running until they return.
        acceptance_criteria:
          - An asyncio.Event or task cancellation cancels in-flight node tasks
          - close still runs after cancellation
        guardrail_refs:
          - PY-CONC-001
          - PY-TEST-002
        tasks:
          - id: CANCEL-001-T1
            status: done
            title: Cancel the wave and still close the node
            instructions:
              files:
                - src/nodeio/run.py
                - src/nodeio/executors.py
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - PY-TEST-002
      - id: CB-001
        status: done
        title: Invoke a callback when a node publishes an output
        overview:
          problem: >-
            Callers can read outputs only after the run returns. They
            cannot observe a value when the node publishes it.
          goal: >-
            The coordinator can push each published output to a callback.
        decision: >-
          In the context of a graph run, facing callers that need each
          published value, we decided to invoke an optional output
          callback from the coordinator, to achieve a push of outputs
          without a second pass, accepting that the callback runs on
          the event loop.
        acceptance_criteria:
          - The callback receives each published output during the run
          - A missing callback leaves the returned outputs unchanged
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: CB-001-T1
            status: done
            title: Call on_output when a node publishes
            instructions:
              files:
                - src/nodeio/run.py
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - PY-TEST-002
      - id: NET-001
        status: open
        title: Reject unsafe HTTP targets and invalid graph inputs
        overview:
          problem: >-
            An HTTP request could follow a DNS answer that was not global,
            and a seed or demux key could name a port the graph does not have.
          goal: >-
            Requests use a checked global address, and seeds and demux keys
            are rejected when they do not match the graph.
        decision: >-
          In the context of outbound HTTP and graph inputs, facing an
          address that was checked and then not used, we decided to pin
          the connection to a global address and reject unknown seeds, to
          achieve a request that matches the check, accepting that an
          injected client receives the pinned URL.
        acceptance_criteria:
          - A non-global or multicast address is rejected
          - The request URL uses the address that was checked
          - Unknown and connected seeds are rejected
          - Demux accepts only left and right
        guardrail_refs:
          - PY-SEC-006
        tasks:
          - id: NET-001-T1
            status: open
            title: Pin HTTP and validate seeds and demux keys
            instructions:
              files:
                - src/nodeio/pipes.py
                - src/nodeio/run.py
                - src/nodeio/builtin.py
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - PY-SEC-006
      - id: PIN-001
        status: done
        title: Pin guardrails 1.17.1 and hash the container install
        overview:
          problem: >-
            The repository still cited guardrails 1.15.0, and the container
            install did not pin dependency hashes.
          goal: >-
            Pins match the current org tags, dev tools live in a dependency
            group, and the container install requires hashes.
        decision: >-
          In the context of the org quality bar, facing a stale pin, we
          decided to move to guardrails 1.17.1 and hash the container
          install, to achieve the current gates, accepting a lock refresh.
        acceptance_criteria:
          - docs/guardrails is 1.17.1 and .github/scaffold is 1.14.3
          - Dev tools are a dependency group
          - The container install uses --require-hashes
        guardrail_refs:
          - SC-DEP-008
          - PY-CONC-002
        tasks:
          - id: PIN-001-T1
            status: done
            title: Bump the pins and record the worker-cancel limit
            instructions:
              files:
                - scripts/check-ci-docker.sh
                - docs/guardrail-deviations.yml
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - SC-DEP-008
              - PY-CONC-002
